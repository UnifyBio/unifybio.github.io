site_name: UnifyBio
site_url: https://unifybio.github.io/
theme:
  name: material
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
hooks:
  - hooks/edn.py
extra_css:
  - stylesheets/extra.css
nav:
  - index.md
  - concepts.md
  - Tutorials:
    - tutorials/quickstart.md
    - tutorials/first-import.md
  - local-system.md
  - unify-cli.md
  - import-config.md
  - schema.md
  - other-resources.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
